<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Table Preview</title>
    <script src="https://unpkg.com/react@19/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root" class="min-h-screen p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const projects = [
            {
                name: 'My Portfolio',
                description: 'Personal portfolio website showcasing my projects, skills, and experience with interactive WebGL face animations.',
                tech: ['React', 'Vite', 'Tailwind CSS', 'WebGL', 'TypeScript'],
                github: 'https://github.com/UmmmmArmaaan/my-portfolio',
            },
            {
                name: 'Mini Task Manager',
                description: 'A simple task management application built with React and Supabase, featuring CRUD operations.',
                tech: ['React', 'Supabase', 'TypeScript', 'CSS'],
                github: 'https://github.com/UmmmmArmaaan/mini-task-manager',
            },
            {
                name: 'MediIndia Care',
                description: 'Smart India Hackathon 2026 submission - A full-stack healthcare platform.',
                tech: ['Next.js', 'React', 'TypeScript', 'Node.js', 'Supabase'],
                github: 'https://github.com/UmmmmArmaaan/MediIndiaCare',
            },
        ];

        function ProjectsTable() {
            const [isMobile, setIsMobile] = useState(false);

            useEffect(() => {
                const checkMobile = () => setIsMobile(window.innerWidth < 640);
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            return (
                <div className="max-w-4xl mx-auto">
                    <h1 className="text-2xl font-bold mb-6 text-center">My Projects</h1>

                    {isMobile ? (
                        // Mobile: Card view
                        <div className="space-y-4">
                            {projects.map((proj) => (
                                <div key={proj.name} className="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                                    <h2 className="text-lg font-bold mb-1">{proj.name}</h2>
                                    <p className="text-gray-600 text-sm mb-2">{proj.description}</p>
                                    <div className="flex flex-wrap gap-1.5 mb-2">
                                        {proj.tech.map((t) => (
                                            <span key={t} className="px-2 py-0.5 text-xs bg-gray-100 border border-gray-200 rounded">
                                                {t}
                                            </span>
                                        ))}
                                    </div>
                                    <a
                                        href={proj.github}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="text-blue-600 hover:underline text-sm"
                                    >
                                        View on GitHub →
                                    </a>
                                </div>
                            ))}
                        </div>
                    ) : (
                        // Desktop: Table view
                        <div className="bg-white rounded-lg shadow-sm overflow-hidden">
                            <table className="w-full">
                                <thead>
                                    <tr className="bg-gray-100">
                                        <th className="px-4 py-3 text-left font-semibold">Project</th>
                                        <th className="px-4 py-3 text-left font-semibold hidden md:table">Tech Stack</th>
                                        <th className="px-4 py-3 text-left font-semibold">GitHub</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {projects.map((proj) => (
                                        <tr key={proj.name} className="border-b border-gray-100 last:border-b-0 hover:bg-gray-50">
                                            <td className="px-4 py-3">
                                                <div className="font-medium">{proj.name}</div>
                                                <div className="text-sm text-gray-600 mt-1">{proj.description}</div>
                                            </td>
                                            <td className="px-4 py-3 hidden md:table">
                                                <div className="flex flex-wrap gap-1.5">
                                                    {proj.tech.map((t) => (
                                                        <span key={t} className="px-2 py-0.5 text-xs bg-gray-100 border border-gray-200 rounded">
                                                            {t}
                                                        </span>
                                                    ))}
                                                </div>
                                            </td>
                                            <td className="px-4 py-3">
                                                <a
                                                    href={proj.github}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-blue-600 hover:underline text-sm font-medium"
                                                >
                                                    github.com/UmmmmArmaaan/{new URL(proj.github).pathname.replace(/^\//, '')}
                                                </a>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<ProjectsTable />, document.getElementById('root'));
    </script>
</body>
</html>
